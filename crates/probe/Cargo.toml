[package]
name = "westplay-probe"
description = "WestPlay's probe: where the DirectX functions the plugin hooks are, found outside the game"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "westplay-probe"
path = "src/main.rs"

[dependencies]
westplay-shared = { path = "../shared" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
