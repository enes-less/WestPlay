[package]
name = "westplay-setup"
description = "Sets WestPlay up on the player's PC: finds the game, its profiles and their mods"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
westplay-mapdata = { path = "../mapdata" }
westplay-shared = { path = "../shared" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[lints]
workspace = true
