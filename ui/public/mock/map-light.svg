<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <!-- Stand-in map for the Dashboard study (light, Apple-Maps-like), until the real map (M6) exists.
       The truck drives up the centre road and turns right onto the E45 highway. -->
  <rect width="1600" height="1600" fill="#f3f1ec"/>

  <!-- Water and parks -->
  <path d="M0 260 C 260 300 420 210 640 250 C 860 290 980 180 1210 150 C 1390 126 1500 160 1600 140 L1600 0 L0 0 Z" fill="#a8d5f2"/>
  <path d="M1040 980 C 1140 940 1290 960 1360 1040 C 1420 1110 1380 1230 1270 1250 C 1150 1272 1050 1200 1030 1120 C 1018 1060 1010 1000 1040 980 Z" fill="#cfe8c3"/>
  <path d="M170 1150 C 260 1110 380 1130 420 1210 C 460 1290 400 1380 300 1380 C 200 1380 130 1310 140 1240 C 146 1200 150 1165 170 1150 Z" fill="#cfe8c3"/>
  <path d="M420 520 C 520 500 600 540 600 610 C 600 680 520 710 440 690 C 370 672 350 600 380 560 C 392 542 404 526 420 520 Z" fill="#cfe8c3"/>

  <!-- City blocks (subtle) -->
  <g fill="#e9e5dc">
    <rect x="300" y="760" width="200" height="160" rx="10"/>
    <rect x="540" y="760" width="170" height="160" rx="10"/>
    <rect x="300" y="960" width="200" height="150" rx="10"/>
    <rect x="540" y="960" width="170" height="150" rx="10"/>
    <rect x="890" y="760" width="190" height="160" rx="10"/>
    <rect x="890" y="960" width="110" height="150" rx="10"/>
    <rect x="1120" y="760" width="200" height="150" rx="10"/>
    <rect x="890" y="1160" width="190" height="150" rx="10"/>
    <rect x="540" y="1160" width="170" height="150" rx="10"/>
    <rect x="890" y="1360" width="190" height="180" rx="10"/>
    <rect x="540" y="1360" width="170" height="180" rx="10"/>
  </g>

  <!-- Minor streets -->
  <g fill="none" stroke="#dcd6ca" stroke-width="22" stroke-linecap="round">
    <path d="M250 940 H 1400"/>
    <path d="M250 1135 H 1100"/>
    <path d="M250 1335 H 1100"/>
    <path d="M520 700 V 1600"/>
    <path d="M1100 700 V 1340"/>
    <path d="M280 700 V 1100"/>
    <path d="M1340 700 V 940"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <path d="M250 940 H 1400"/>
    <path d="M250 1135 H 1100"/>
    <path d="M250 1335 H 1100"/>
    <path d="M520 700 V 1600"/>
    <path d="M1100 700 V 1340"/>
    <path d="M280 700 V 1100"/>
    <path d="M1340 700 V 940"/>
  </g>

  <!-- Main streets -->
  <g fill="none" stroke-linecap="round">
    <path d="M200 735 H 1450" stroke="#d6cfc1" stroke-width="36"/>
    <path d="M800 1600 V 735" stroke="#d6cfc1" stroke-width="38"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M200 735 H 1450" stroke="#ffffff" stroke-width="28"/>
    <path d="M800 1600 V 735" stroke="#ffffff" stroke-width="30"/>
  </g>

  <!-- E45 highway -->
  <path d="M800 735 C 900 690 1000 600 1140 560 C 1300 515 1460 530 1600 500" fill="none" stroke="#e2b64a" stroke-width="44" stroke-linecap="round"/>
  <path d="M0 640 C 200 640 400 620 600 600 C 680 592 740 640 800 735" fill="none" stroke="#e2b64a" stroke-width="44" stroke-linecap="round"/>
  <path d="M800 735 C 900 690 1000 600 1140 560 C 1300 515 1460 530 1600 500" fill="none" stroke="#f8d56c" stroke-width="20" stroke-linecap="round"/>
  <path d="M0 640 C 200 640 400 620 600 600 C 680 592 740 640 800 735" fill="none" stroke="#f8d56c" stroke-width="20" stroke-linecap="round"/>

  <!-- Route -->
  <path d="M800 1600 V 760 C 800 745 812 730 830 722 C 930 678 1010 595 1140 560 C 1300 515 1460 530 1600 500" fill="none" stroke="#0a5fd6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M800 1600 V 760 C 800 745 812 730 830 722 C 930 678 1010 595 1140 560 C 1300 515 1460 530 1600 500" fill="none" stroke="#0a84ff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Labels -->
  <g font-family="Segoe UI, sans-serif" font-weight="600" fill="#6d7076">
    <text x="830" y="1250" font-size="30" transform="rotate(-90 830 1250)">Zakopiańska</text>
    <text x="300" y="725" font-size="28">Wadowicka</text>
    <text x="1180" y="1095" font-size="28" fill="#4f7f58">Park Jordana</text>
    <text x="700" y="180" font-size="32" fill="#3d77a8">Wisła</text>
  </g>
  <g>
    <rect x="1236" y="470" width="78" height="40" rx="8" fill="#2f8a52"/>
    <text x="1275" y="499" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">E45</text>
  </g>
</svg>
